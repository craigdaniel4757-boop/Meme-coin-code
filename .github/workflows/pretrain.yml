name: Refresh MemeMind AI pretrained brain

# Periodically re-runs website/scripts/pretrain.ts against real, current
# historical Solana meme coin candles (DexScreener + GeckoTerminal, both
# free/keyless) and commits the refreshed weights, so the site's starting
# brain doesn't go stale as meme coin regimes drift over time.
#
# NOTE: GitHub only fires `schedule` triggers for workflow files that live
# on the repository's default branch. While this lives only on a feature
# branch, only the manual "Run workflow" button (workflow_dispatch) will
# work -- the weekly schedule activates once this is merged.

"on":
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pretrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run pretraining against real historical data
        run: npm run pretrain

      - name: Commit refreshed brain if it changed
        run: |
          if git diff --quiet -- src/data/pretrainedBrain.json; then
            echo "No change to pretrainedBrain.json -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/pretrainedBrain.json
          git commit -m "Refresh pretrained brain from latest historical data"
          git push
