name: stock-chart-analyzer CI

on:
  push:
    branches: [main, master]
    paths:
      - "stock-chart-analyzer/**"
      - ".github/workflows/stock-chart-analyzer-ci.yml"
  pull_request:
    paths:
      - "stock-chart-analyzer/**"
      - ".github/workflows/stock-chart-analyzer-ci.yml"

defaults:
  run:
    working-directory: stock-chart-analyzer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: stock-chart-analyzer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
